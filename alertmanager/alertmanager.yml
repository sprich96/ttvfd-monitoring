# critical/warning -> ntfy.sh (URL + token via Docker secrets from .env).
# watchdog -> external dead-man's switch (phase 8).
global:
  resolve_timeout: 5m

route:
  receiver: blackhole
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: watchdog
      repeat_interval: 5m
    - matchers: ['severity="critical"']
      receiver: critical
    - matchers: ['severity="warning"']
      receiver: warning

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, instance]

receivers:
  - name: blackhole
  - name: watchdog     # -> external dead-man's switch (phase 8)
  - name: critical
    webhook_configs:
      - url_file: /run/secrets/ntfy_url_critical
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/ntfy_token
  - name: warning
    webhook_configs:
      - url_file: /run/secrets/ntfy_url_warning
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/ntfy_token

    hostname: ""
    os: Linux (VMware VM)
    role: unknown
    ports: [22]
    monitor: [blackbox-icmp]
    confirm: true
  - ip: 10.1.6.110
    hostname: fireops.ttvfd.com
    os: Linux (VMware VM)
    role: linux-server
    ports: [22, 80]
    monitor: [node_exporter, journal, blackbox-http]
  - ip: 10.1.6.111
    hostname: ""
    os: Linux (VMware VM)
    role: unknown
    ports: [22, 80]
    monitor: [blackbox-icmp]
    confirm: true
  - ip: 10.1.6.116
    hostname: ""
    os: Ubiquiti device
    role: unknown-unifi       # adopted device without DNS name? UnPoller will identify it
    ports: [22]
    monitor: [unpoller, blackbox-icmp]
    confirm: true
  - ip: 10.1.6.173
    hostname: TestWin10.ttvfd.com
    os: Linux (Dell hardware); DNS name says Windows 10
    role: unknown             # stale DNS record, or re-imaged box?
    ports: [22, 111]
    monitor: []

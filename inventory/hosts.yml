  - ip: 10.1.6.35
    hostname: ttvfd-st2-r640-01-ipmi.ttvfd.com
    os: Dell iDRAC
    role: bmc
    ports: [22, 80, 443]
    monitor: [blackbox-icmp, blackbox-https]   # redfish/snmp hardware health later if wanted
  - ip: 10.1.6.40
    hostname: Station2BayNutServer.ttvfd.com

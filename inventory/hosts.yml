# Discovery inventory: nmap sweep 2026-11-13/14 (read-only, -T3, max-rate 100/50, no NSE scripts).
# Raw output: inventory/raw/ (gitignored). Status: DRAFT, pending operator confirmation.
# os = best guess from nmap fingerprint + banners (fingerprints for UniFi/ESXi are unreliable).
# monitor = proposed collection path; nothing is installed or changed until approved.
# confirm: true = role/identity uncertain, operator to verify.

servers:                                  # 10.1.6.0/24
  - ip: 10.1.6.1
    hostname: _gateway
    os: UniFi OS (console + gateway)
    role: unifi-console
    ports: [22, 53, 80, 443, 8080, 8443, 8444, 9443]
    monitor: [unpoller, blackbox-icmp, syslog]
  - ip: 10.1.6.10
    hostname: TTVFDDC01.ttvfd.com
    os: Windows Server (VMware VM)
    role: domain-controller
    ports: [53, 88, 135, 389, 445, 464, 515, 3268, 3269, 5985]
    monitor: ["windows_exporter(ad,dns,dhcp?)", eventlog, blackbox-dns, blackbox-ldap, blackbox-kerberos]
    notes: "515/lpd open (Print Services role on a DC?)"
  - ip: 10.1.6.11
    hostname: TTVFDDC02.ttvfd.com
    os: Windows Server (VMware VM)
    role: domain-controller
    ports: [53, 88, 135, 389, 445, 464, 3268, 3269, 5985]
    monitor: ["windows_exporter(ad,dns,dhcp?)", eventlog, blackbox-dns, blackbox-ldap, blackbox-kerberos]
  - ip: 10.1.6.14
    hostname: ttvfd-radio-recording.ttvfd.com
    os: Linux (physical?)
    role: linux-server
    ports: [22]
    monitor: [node_exporter, journal]
  - ip: 10.1.6.15
    hostname: influx.ttvfd.com
    os: Linux (VMware VM)
    role: linux-server
    ports: [22]
    monitor: [node_exporter, journal]
  - ip: 10.1.6.22
    hostname: unraid.ttvfd.com
    os: Unraid 7.2.3
    role: unraid
    ports: [22, 80, 111, 139, 445]
    monitor: ["node_exporter(container)", smartctl_exporter, textfile-array-state]
  - ip: 10.1.6.23
    hostname: ""
    os: "Linux (same profile as unraid: nginx + Samba + rpcbind)"
    role: unknown            # second Unraid / NAS?
    ports: [22, 80, 111, 139, 445]
    monitor: [blackbox-icmp]
    confirm: true
  - ip: 10.1.6.24
    hostname: veeam.ttvfd.com
    os: Windows Server (physical)
    role: [hyperv-host, veeam-vbr]   # runs this monitoring VM
    ports: [111, 135, 443, 2179, 3389, 9419]
    monitor: ["windows_exporter(hyperv)", "eventlog(Hyper-V-VMMS, Hyper-V-Worker, Veeam Backup)", "veeam-exporter(:9419)"]
    notes: "443=Kestrel (VBR web UI, suggests v12.3+/13 on Windows); 111=vPower NFS; WinRM 5985 not open"
  - ip: 10.1.6.25
    hostname: monitor-grafana / grafana.ttvfd.com
    os: Linux (Hyper-V VM)
    role: monitoring              # this VM, excluded from scan
    monitor: ["node_exporter(stack)"]
  - ip: 10.1.6.26
    hostname: township-web-server.ttvfd.com
    os: Linux (VMware VM)
    role: linux-server
    ports: [22, 8080]
    monitor: [node_exporter, journal, "blackbox-http?"]
  - ip: 10.1.6.29
    hostname: vcenter.ttvfd.com
    os: VCSA
    role: vcenter
    ports: [22, 25, 80, 389, 443, 514, 636]
    monitor: [telegraf-vsphere, blackbox-https]
  - ip: 10.1.6.30
    hostname: librenms.ttvfd.com
    os: Linux (VMware VM)
    role: linux-server         # existing LibreNMS instance
    ports: [22, 80, 111]
    monitor: [node_exporter, journal]
    notes: "Existing LibreNMS: already polling SNMP? keep or retire is operator's call"
  - ip: 10.1.6.31
    hostname: st1-esxi-1.ttvfd.com

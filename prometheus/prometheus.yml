global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: ttvfd

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- self-monitoring (monitoring VM: monitor-grafana) ---
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: {instance: monitor-grafana}
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels: {instance: monitor-grafana}
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
        labels: {instance: monitor-grafana}
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
        labels: {instance: monitor-grafana}
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
        labels: {instance: monitor-grafana}
  - job_name: node
    static_configs:
      - targets: [172.30.0.1:9100]
        labels: {instance: monitor-grafana, role: monitoring}
    # Phase 3 adds: file_sd_configs: [{files: [/etc/prometheus/targets/node/*.yml]}]
